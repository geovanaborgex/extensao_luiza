<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Relatórios | Painel Administrativo</title>
    
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/relatorios.css">
    <link rel="stylesheet" href="css/menu.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>
    <button class="menu-toggle" id="menuToggle">
        <i class="fa-solid fa-bars"></i>
      </button>
      
      <div class="menu-overlay" id="menuOverlay"></div>
      

<div class="layout">

  <!-- MENU LATERAL -->

<aside class="sidebar">

  <!-- Logo -->

  <div class="logo">

      <h2>Luiza</h2>

      <span>Painel Administrativo</span>

  </div>


  <!-- Menu -->

  <nav>

      <a href="dashboard.html" class="ativo">

          <i class="fa-solid fa-house"></i>

          <span>Dashboard</span>

      </a>

      <a href="relatorios.html">

          <i class="fa-solid fa-chart-column"></i>

          <span>Relatórios</span>

      </a>

      <a href="index.html">

          <i class="fa-solid fa-arrow-right-from-bracket"></i>

          <span>Sair</span>

      </a>

  </nav>

</aside>

    <!-- CONTEÚDO -->

    <main class="conteudo">

        <header class="topo">
    
            <div>
    
                <h1>Relatórios de Agendamentos</h1>
    
                <p>Consulte os resultados do salão por período.</p>
    
            </div>
    
        </header>
    
        <!-- FILTROS -->
    
        <section class="filtros">
    
            <div>
    
                <label>Data Inicial</label>
    
                <input type="date" id="dataInicial">
    
            </div>
    
            <div>
    
                <label>Data Final</label>
    
                <input type="date" id="dataFinal">
    
            </div>
    
            <div>
    
                <label>Procedimento</label>
    
                <select id="filtroProcedimento">
    
                    <option value="">Todos</option>
    
                </select>
    
            </div>
    
            <button id="btnGerar">
    
                <i class="fa-solid fa-magnifying-glass"></i>
    
                Gerar Relatório
    
            </button>
    
        </section>
    
    
    
        <!-- CARDS -->
    
        <section class="cards">
    
            <div class="card">
    
                <i class="fa-solid fa-calendar-check"></i>
    
                <h3>Agendamentos</h3>
    
                <span id="cardAgendamentos">0</span>
    
            </div>
    
            <div class="card">
    
                <i class="fa-solid fa-sack-dollar"></i>
    
                <h3>Valor Total</h3>
    
                <span id="cardValor">R$ 0,00</span>
    
            </div>
    
            <div class="card">
    
                <i class="fa-solid fa-star"></i>
    
                <h3>Ticket Médio</h3>
    
                <span id="ticketMedio">R$ 0,00</span>
    
            </div>
    
        </section>

        <!-- RELATORIO -->
    
        <section class="tabela">
    
            <div class="titulo-tabela">
    
                <h2>Agendamentos</h2>
    
                <div>    
                </div>
    
            </div>
    
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
    
                        <th>Hora</th>
    
                        <th>Cliente</th>
    
                        <th>Procedimento</th>
    
                        <th>Valor</th>
                    </tr>
    
                </thead>
    
                <tbody id="corpoTabela">
    
                </tbody>
    
            </table>
    
        </section>
    
    </main>
    
    <script src="js/relatorios.js"></script>

</div>

</body>
</html>
