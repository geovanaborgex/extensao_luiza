<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Painel Administrativo</title>

    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/menu.css">

</head>

<body>

  <!-- MENU LATERAL -->

<aside class="sidebar">

  <!-- Logo -->

  <div class="logo">

      <h2>Luiza</h2>

      <span>Painel Administrativo</span>

  </div>


  <!-- Menu -->

  <nav>

      <a href="dashboard.html" class="ativo">

          <i class="fa-solid fa-house"></i>

          <span>Dashboard</span>

      </a>


      <a href="agendamentos.html">

          <i class="fa-solid fa-calendar-days"></i>

          <span>Agendamentos</span>

      </a>


      <a href="clientes.html">

          <i class="fa-solid fa-users"></i>

          <span>Clientes</span>

      </a>


      <a href="relatorios.html">

          <i class="fa-solid fa-chart-column"></i>

          <span>Relatórios</span>

      </a>


      <a href="configuracoes.html">

          <i class="fa-solid fa-gear"></i>

          <span>Configurações</span>

      </a>


      <hr>


      <a href="index.html">

          <i class="fa-solid fa-arrow-right-from-bracket"></i>

          <span>Sair</span>

      </a>

  </nav>

</aside>


<div class="wrap">

 
    <!-- ==========================
         TOPO
    =========================== -->

    <header class="top">

        <div>

            <h1>Painel de Administrador</h1>

        </div>

        <div class="date" id="lblDataAtual">

            Carregando...

        </div>

    </header>


    <!-- ==========================
         MENSAGEM DE ERRO
    =========================== -->

    <div id="status-banner" class="status-banner">

    </div>


    <!-- ==========================
         CARDS DO RESUMO
    =========================== -->

    <section>

        <div class="cards">

            <!-- Hoje -->
            <div class="card accent">

                <div class="label">
                    Atendimentos Hoje
                </div>

                <div class="big" id="cardHoje">

                    0

                </div>

                <div class="sub" id="cardHojeTexto">

                    Nenhum atendimento

                </div>

            </div>


            <!-- Semana -->

            <div class="card">

                <div class="label">

                    Atendimentos na Semana

                </div>

                <div class="big" id="cardSemana">

                    0

                </div>

                <div class="sub">

                    Segunda a Domingo

                </div>

            </div>


            <!-- Próximo -->

            <div class="card">

                <div class="label">

                    Próximo Atendimento

                </div>

                <div class="big" id="cardProximoHorario">

                    --

                </div>

                <div class="sub" id="cardProximoNome">

                    Nenhum atendimento

                </div>

            </div>

        </div>

    </section>


    <!-- ==========================
         AGENDA DE HOJE
    =========================== -->

    <section>

        <div class="section-head">

            <h2>

                Agenda de Hoje

            </h2>

            <div class="count" id="totalHoje">

                0

            </div>

        </div>

        <div id="agendaHoje" class="timeline">

            <!-- JavaScript cria os cartões -->

        </div>

    </section>


    <!-- ==========================
         AGENDA DA SEMANA
    =========================== -->

    <section>

        <div class="section-head">

            <h2>

                Agenda da Semana

            </h2>

        </div>

        <div id="agendaSemana" class="week-grid">

            <!-- JavaScript cria os dias -->

        </div>

    </section>

</div>



<!-- =====================================
     MODAL
====================================== -->

<div class="overlay" id="overlay">

    <div class="modal">

        <button id="btnFecharModal" class="close-x">

            ✕

        </button>

        <div id="conteudoModal">

        </div>

    </div>

</div>



<!-- =====================================
     TOAST
====================================== -->

<div id="toast" class="toast">

</div>



<!-- =====================================
     JAVASCRIPT
====================================== -->

<script src="js/admin.js"></script>

</body>
</html>
